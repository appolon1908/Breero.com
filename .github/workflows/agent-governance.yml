name: Agent governance
on:
  pull_request:
  push:
    branches:
      - main
      - governance/single-lane-lock-20260926
permissions:
  contents: read
jobs:
  single-lane-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce single-lane authority
        run: sh scripts/agent_preflight.sh ci
