name: Build immutable Breero candidate images (no deployment)

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: breero-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            repository: breero-api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
            build_args: ""
          - component: frontend
            repository: breero-frontend
            context: .
            dockerfile: ./deploy/frontend/Dockerfile
            build_args: ""
          - component: partner
            repository: breero-partner
            context: .
            dockerfile: ./deploy/portals/Dockerfile
            build_args: |
              APP_NAME=partner
              NEXT_PUBLIC_API_BASE_URL=https://api.breero.com/api/v1
          - component: ops
            repository: breero-ops
            context: .
            dockerfile: ./deploy/portals/Dockerfile
            build_args: |
              APP_NAME=ops
              NEXT_PUBLIC_API_BASE_URL=https://api.breero.com/api/v1
          - component: admin
            repository: breero-admin
            context: .
            dockerfile: ./deploy/portals/Dockerfile
            build_args: |
              APP_NAME=admin
              NEXT_PUBLIC_API_BASE_URL=https://api.breero.com/api/v1
    steps:
      - name: Check out the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact protected main head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }} candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ghcr.io/appolon1908/${{ matrix.repository }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest exact ${{ matrix.component }} build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/appolon1908/${{ matrix.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable component evidence
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_REPOSITORY: ghcr.io/appolon1908/${{ matrix.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source_sha "$GITHUB_SHA" --arg component "$COMPONENT" --arg image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            '{schema_version:"codestra.candidate-image.v1",repository:$repository,source_sha:$source_sha,component:$component,image:$image,production_authorized:false}' \
            > candidate.json

      - name: Upload component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: breero-${{ matrix.component }}-candidate-${{ github.sha }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30
